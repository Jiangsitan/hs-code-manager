<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>仁昊伟业HS编码管理系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .btn-primary { @apply bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition-all duration-200 shadow-sm hover:shadow-md; }
        .btn-success { @apply bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg transition-all duration-200 shadow-sm hover:shadow-md; }
        .btn-danger { @apply bg-red-500 hover:bg-red-600 text-white px-3 py-1.5 rounded-lg transition-all duration-200; }
        .btn-secondary { @apply bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 py-2 rounded-lg transition-all duration-200; }
        .input-field { @apply w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all duration-200 outline-none; }
        .card { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-6; }
        .stat-card { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-6 hover:shadow-md transition-all duration-200; }
        .table-row:hover { @apply bg-blue-50; }
        .badge-sync { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-100 text-blue-800; }
        .badge-manual { @apply inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800; }
        .search-result-item:hover { @apply bg-blue-50; }
        .truncate-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    </style>
</head>

    <script>
        const API_BASE = '/api/hs-codes';
        let currentPage = 1;
        let currentKeyword = '';
        let deleteTarget = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStats();
            loadData();
            updateTime();
            setInterval(updateTime, 1000);

            let searchTimer;
            document.getElementById('searchInput').addEventListener('input', (e) => {
                clearTimeout(searchTimer);
                searchTimer = setTimeout(() => {
                    currentKeyword = e.target.value;
                    currentPage = 1;
                    loadData();
                }, 300);
            });

            document.getElementById('hsCodeForm').addEventListener('submit', handleSubmit);
        });

        function updateTime() {
            document.getElementById('currentTime').textContent = new Date().toLocaleString('zh-CN');
        }

        async function loadStats() {
            try {
                const res = await fetch(`${API_BASE}/stats`);
                const data = await res.json();
                if (data.code === 200) {
                    animateNumber('totalCount', data.data.totalCount);
                    animateNumber('syncCount', data.data.syncCount);
                    animateNumber('manualCount', data.data.manualCount);
                }
            } catch (e) { console.error('加载统计失败:', e); }
        }

        function animateNumber(id, target) {
            const el = document.getElementById(id);
            const start = parseInt(el.textContent) || 0;
            const diff = target - start;
            const duration = 500;
            const startTime = performance.now();
            function update(time) {
                const elapsed = time - startTime;
                const progress = Math.min(elapsed / duration, 1);
                el.textContent = Math.round(start + diff * progress);
                if (progress < 1) requestAnimationFrame(update);
            }
            requestAnimationFrame(update);
        }

        async function loadData() {
            try {
                let url = `${API_BASE}?page=${currentPage}&size=10`;
                if (currentKeyword) url += `&keyword=${encodeURIComponent(currentKeyword)}`;
                const res = await fetch(url);
                const result = await res.json();
                if (result.code === 200) {
                    renderTable(result.data.records);
                    renderPagination(result.data);
                }
            } catch (e) { console.error('加载数据失败:', e); }
        }

        function renderTable(records) {
            const tbody = document.getElementById('tableBody');
            const empty = document.getElementById('emptyState');
            if (!records || records.length === 0) {
                tbody.innerHTML = '';
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            tbody.innerHTML = records.map(r => `
                <tr class="table-row transition-colors cursor-pointer" onclick="viewDetail('${r.hsCode}')">
                    <td class="px-5 py-4">
                        <span class="font-mono text-sm font-semibold text-blue-600">${r.hsCode || '-'}</span>
                    </td>
                    <td class="px-5 py-4 text-sm text-gray-900 max-w-[160px] truncate" title="${r.productName || ''}">${r.productName || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-500 max-w-[160px] truncate" title="${r.productDescription || ''}">${r.productDescription || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-600 max-w-[140px] truncate" title="${r.productNameCn || ''}">${r.productNameCn || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-500 max-w-[140px] truncate" title="${r.productNameEn || ''}">${r.productNameEn || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-600 max-w-[180px] truncate" title="${r.declarationElements || ''}">${r.declarationElements || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.firstUnit || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.secondUnit || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.exportTaxRebateRate || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.mfnRate || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.commonRate || '-'}</td>
                    <td class="px-5 py-4 text-sm text-gray-700">${r.customsSupervision || '-'}</td>
                    <td class="px-5 py-4">
                        <span class="${r.dataSource === 'sync' ? 'badge-sync' : 'badge-manual'}">
                            ${r.dataSource === 'sync' ? '同步' : '手动'}
                        </span>
                    </td>
                    <td class="px-5 py-4" onclick="event.stopPropagation()">
                        <div class="flex items-center gap-2">
                            <button onclick="openEditModal('${r.hsCode}')" class="text-blue-600 hover:text-blue-800 hover:bg-blue-50 p-1.5 rounded-lg transition-colors" title="编辑">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                </svg>
                            </button>
                            <button onclick="openDeleteModal('${r.hsCode}')" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-1.5 rounded-lg transition-colors" title="删除">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        function renderPagination(page) {
            const { pages, current, total } = page;
            document.getElementById('totalRecords').textContent = total;
            const container = document.getElementById('pagination');
            if (pages <= 1) { container.innerHTML = ''; return; }
            let html = '';
            html += `<button onclick="goToPage(${current - 1})" class="px-3 py-1.5 rounded-lg text-sm ${current === 1 ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-200'}" ${current === 1 ? 'disabled' : ''}>上一页</button>`;
            const start = Math.max(1, current - 2);
            const end = Math.min(pages, current + 2);
            if (start > 1) html += `<button onclick="goToPage(1)" class="px-3 py-1.5 rounded-lg text-sm text-gray-700 hover:bg-gray-200">1</button><span class="text-gray-400">...</span>`;
            for (let i = start; i <= end; i++) {
                html += `<button onclick="goToPage(${i})" class="px-3 py-1.5 rounded-lg text-sm ${i === current ? 'bg-blue-600 text-white' : 'text-gray-700 hover:bg-gray-200'}">${i}</button>`;
            }
            if (end < pages) html += `<span class="text-gray-400">...</span><button onclick="goToPage(${pages})" class="px-3 py-1.5 rounded-lg text-sm text-gray-700 hover:bg-gray-200">${pages}</button>`;
            html += `<button onclick="goToPage(${current + 1})" class="px-3 py-1.5 rounded-lg text-sm ${current === pages ? 'text-gray-300 cursor-not-allowed' : 'text-gray-700 hover:bg-gray-200'}" ${current === pages ? 'disabled' : ''}>下一页</button>`;
            container.innerHTML = html;
        }

        function goToPage(p) { currentPage = p; loadData(); }

        function openAddModal() {
            document.getElementById('isEdit').value = 'false';
            document.getElementById('formTitle').textContent = '新增HS编码';
            document.getElementById('formHsCode').disabled = false;
            document.getElementById('hsCodeForm').reset();
            document.getElementById('formDataSource').value = 'manual';
            document.getElementById('remoteSearchSection').classList.remove('hidden');
            document.getElementById('searchResults').classList.add('hidden');
            document.getElementById('searchNameInput').value = '';
            document.getElementById('formModal').classList.remove('hidden');
        }

        // 远程搜索（按品名）
        async function remoteSearch() {
            const keyword = document.getElementById('searchNameInput').value.trim();
            if (!keyword) {
                showToast('请输入品名关键词', 'error');
                return;
            }
            const btn = document.getElementById('remoteSearchBtn');
            const origText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>搜索中...';
            try {
                const res = await fetch(`${API_BASE}/remote-search?keyword=${encodeURIComponent(keyword)}`);
                const result = await res.json();
                const container = document.getElementById('searchResults');
                 if (result.code === 200 && result.data.length > 0) {
                    // 按数据来源站点标识（hsguilei=归类通 / hsbianma=HS编码网）
                    container.innerHTML = `
                        <div class="px-4 py-2 bg-blue-50 border-b border-blue-100 text-xs text-blue-700 flex items-center gap-1.5">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
                            共 ${result.data.length} 条结果（hsguilei.com + hsbianma.com 双源合并）
                        </div>
                        ${result.data.map(r => {
                            const fromHsguilei = r.sourceSite !== 'hsbianma';
                            const name = r.productName || '';
                            const descr = r.productDescription || '';
                            return `
                            <div class="search-result-item px-4 py-3 cursor-pointer border-b border-gray-100 last:border-0"
                                 onclick="selectSearchResult('${r.hsCode}')">
                                <div class="flex items-center gap-3">
                                    <span class="font-mono text-sm font-semibold text-blue-600">${r.hsCode}</span>
                                    <span class="text-sm text-gray-900">${name}</span>
                                    <span class="text-[10px] px-1.5 py-0.5 rounded ${fromHsguilei ? 'bg-emerald-100 text-emerald-700' : 'bg-amber-100 text-amber-700'}">${fromHsguilei ? '归类通' : 'HS编码网'}</span>
                                </div>
                                ${descr ? `<div class="text-xs text-gray-500 mt-1">${descr}</div>` : ''}
                                <div class="flex items-center gap-4 mt-1.5 text-xs text-gray-500">
                                    ${r.exportTaxRebateRate ? `<span>退税率: <span class="text-emerald-600 font-medium">${r.exportTaxRebateRate}</span></span>` : ''}
                                    ${r.mfnRate ? `<span>最惠国: <span class="text-orange-600 font-medium">${r.mfnRate}</span></span>` : ''}
                                    ${r.commonRate ? `<span>普通: <span class="text-red-600 font-medium">${r.commonRate}</span></span>` : ''}
                                </div>
                            </div>
                        `}).join('')}
                    `;
                    container.classList.remove('hidden');
                } else {
                    container.innerHTML = `
                        <div class="px-4 py-6 text-center text-gray-500 text-sm">
                            <svg class="w-8 h-8 text-gray-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                            <p class="font-medium text-gray-600 mb-1">未找到"${keyword}"相关结果</p>
                            <p class="text-xs text-gray-400">建议：使用HS编码（如8544）或标准品名（如"电线"、"电缆"、"马"）搜索</p>
                        </div>
                    `;
                    container.classList.remove('hidden');
                }
            } catch (e) {
                showToast('搜索失败: ' + e.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerHTML = origText;
            }
        }

        // 选择搜索结果 → 拉取详情 → 填充表单
        async function selectSearchResult(hsCode) {
            document.getElementById('searchResults').classList.add('hidden');
            try {
                const res = await fetch(`${API_BASE}/remote-query?hsCode=${encodeURIComponent(hsCode)}`);
                const result = await res.json();
                if (result.code === 200) {
                    const d = result.data;
                    document.getElementById('formHsCode').value = d.hsCode || hsCode;
                    document.getElementById('formProductName').value = d.productName || '';
                    document.getElementById('formProductDescription').value = d.productDescription || '';
                    document.getElementById('formProductNameCn').value = '';
                    document.getElementById('formProductNameEn').value = '';
                    document.getElementById('formDeclarationElements').value = d.declarationElements || '';
                    document.getElementById('formFirstUnit').value = d.firstUnit || '';
                    document.getElementById('formSecondUnit').value = d.secondUnit || '';
                    document.getElementById('formExportTaxRebateRate').value = d.exportTaxRebateRate || '';
                    document.getElementById('formMfnRate').value = d.mfnRate || '';
                    document.getElementById('formCommonRate').value = d.commonRate || '';
                    document.getElementById('formImportVat').value = d.importVat || '';
                    document.getElementById('formImportConsumptionTax').value = d.importConsumptionTax || '';
                    document.getElementById('formClassificationReference').value = d.classificationReference || '';
                    document.getElementById('formCustomsSupervision').value = d.customsSupervision || '';
                    document.getElementById('formInspectionQuarantine').value = d.inspectionQuarantine || '';
                    document.getElementById('formDataSource').value = 'sync';
                    showToast('已填入详情，请核对后保存');
                } else {
                    showToast(result.message || '查询详情失败', 'error');
                }
            } catch (e) {
                showToast('查询详情失败: ' + e.message, 'error');
            }
        }

        async function openEditModal(hsCode) {
            try {
                const res = await fetch(`${API_BASE}/${hsCode}`);
                const result = await res.json();
                if (result.code === 200) {
                    const d = result.data;
                    document.getElementById('isEdit').value = 'true';
                    document.getElementById('formTitle').textContent = '编辑HS编码';
                    document.getElementById('formHsCode').value = d.hsCode;
                    document.getElementById('formHsCode').disabled = true;
                    document.getElementById('remoteSearchSection').classList.add('hidden');
                    document.getElementById('formProductName').value = d.productName || '';
                    document.getElementById('formProductDescription').value = d.productDescription || '';
                    document.getElementById('formProductNameCn').value = d.productNameCn || '';
                    document.getElementById('formProductNameEn').value = d.productNameEn || '';
                    document.getElementById('formDeclarationElements').value = d.declarationElements || '';
                    document.getElementById('formFirstUnit').value = d.firstUnit || '';
                    document.getElementById('formSecondUnit').value = d.secondUnit || '';
                    document.getElementById('formExportTaxRebateRate').value = d.exportTaxRebateRate || '';
                    document.getElementById('formMfnRate').value = d.mfnRate || '';
                    document.getElementById('formCommonRate').value = d.commonRate || '';
                    document.getElementById('formImportVat').value = d.importVat || '';
                    document.getElementById('formImportConsumptionTax').value = d.importConsumptionTax || '';
                    document.getElementById('formClassificationReference').value = d.classificationReference || '';
                    document.getElementById('formCustomsSupervision').value = d.customsSupervision || '';
                    document.getElementById('formInspectionQuarantine').value = d.inspectionQuarantine || '';
                    document.getElementById('formDataSource').value = d.dataSource || 'manual';
                    document.getElementById('formModal').classList.remove('hidden');
                }
            } catch (e) { showToast('获取数据失败', 'error'); }
        }

        function closeFormModal() { document.getElementById('formModal').classList.add('hidden'); }

        async function handleSubmit(e) {
            e.preventDefault();
            const isEdit = document.getElementById('isEdit').value === 'true';
            const body = {
                productName: document.getElementById('formProductName').value || null,
                productDescription: document.getElementById('formProductDescription').value || null,
                productNameCn: document.getElementById('formProductNameCn').value || null,
                productNameEn: document.getElementById('formProductNameEn').value || null,
                declarationElements: document.getElementById('formDeclarationElements').value || null,
                firstUnit: document.getElementById('formFirstUnit').value || null,
                secondUnit: document.getElementById('formSecondUnit').value || null,
                exportTaxRebateRate: document.getElementById('formExportTaxRebateRate').value || null,
                mfnRate: document.getElementById('formMfnRate').value || null,
                commonRate: document.getElementById('formCommonRate').value || null,
                importVat: document.getElementById('formImportVat').value || null,
                importConsumptionTax: document.getElementById('formImportConsumptionTax').value || null,
                classificationReference: document.getElementById('formClassificationReference').value || null,
                customsSupervision: document.getElementById('formCustomsSupervision').value || null,
                inspectionQuarantine: document.getElementById('formInspectionQuarantine').value || null,
                dataSource: document.getElementById('formDataSource').value,
            };
            try {
                let res;
                if (isEdit) {
                    const hsCode = document.getElementById('formHsCode').value;
                    res = await fetch(`${API_BASE}/${hsCode}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                } else {
                    body.hsCode = document.getElementById('formHsCode').value;
                    if (!body.hsCode) { showToast('请填写归类编号', 'error'); return; }
                    res = await fetch(API_BASE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
                }
                const result = await res.json();
                if (result.code === 200) {
                    showToast(isEdit ? '更新成功' : '新增成功');
                    closeFormModal();
                    loadData();
                    loadStats();
                } else {
                    showToast(result.message || '操作失败', 'error');
                }
            } catch (e) { showToast('操作失败: ' + e.message, 'error'); }
        }

        function openDeleteModal(hsCode) {
            deleteTarget = hsCode;
            document.getElementById('deleteHsCode').textContent = hsCode;
            document.getElementById('deleteModal').classList.remove('hidden');
        }
        function closeDeleteModal() { document.getElementById('deleteModal').classList.add('hidden'); }
        async function confirmDelete() {
            try {
                const res = await fetch(`${API_BASE}/${deleteTarget}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.code === 200) {
                    showToast('删除成功');
                    closeDeleteModal();
                    loadData();
                    loadStats();
                } else {
                    showToast(result.message || '删除失败', 'error');
                }
            } catch (e) { showToast('删除失败', 'error'); }
        }

        async function viewDetail(hsCode) {
            try {
                const res = await fetch(`${API_BASE}/${hsCode}`);
                const result = await res.json();
                if (result.code === 200) {
                    const d = result.data;
                    document.getElementById('detailContent').innerHTML = `
                        <div class="flex items-center gap-3 pb-4 border-b border-gray-100">
                            <span class="font-mono text-2xl font-bold text-blue-600">${d.hsCode}</span>
                            <span class="${d.dataSource === 'sync' ? 'badge-sync' : 'badge-manual'} text-sm">${d.dataSource === 'sync' ? '同步' : '手动'}</span>
                        </div>
                        <h4 class="text-sm font-semibold text-gray-700 mt-4 mb-2">基本信息</h4>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${detailItem('商品名称', d.productName)}
                            ${detailItem('商品描述', d.productDescription)}
                            ${detailItem('报关品名（中文）', d.productNameCn)}
                            ${detailItem('报关品名（英文）', d.productNameEn)}
                            ${detailItem('法定第一单位', d.firstUnit)}
                            ${detailItem('法定第二单位', d.secondUnit)}
                        </div>
                        <h4 class="text-sm font-semibold text-gray-700 mt-4 mb-2">税率信息</h4>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${detailItem('最惠国税率', d.mfnRate)}
                            ${detailItem('普通税率', d.commonRate)}
                            ${detailItem('出口退税率', d.exportTaxRebateRate)}
                            ${detailItem('进口增值税', d.importVat)}
                            ${detailItem('进口消费税', d.importConsumptionTax)}
                        </div>
                        ${detailFullItem('申报要素', d.declarationElements)}
                        ${d.classificationReference ? `
                        <div class="pt-2">
                            <span class="text-sm text-gray-500">归类参考（常见报关品名及占比）</span>
                            <div class="flex flex-wrap gap-2 mt-1">
                                ${d.classificationReference.split(';').map(item => {
                                    const match = item.match(/^(.+?)\((.+)\)$/);
                                    return match ? `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-blue-50 text-blue-700">${match[1]} <span class="ml-1 text-blue-500">${match[2]}</span></span>` : `<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-50 text-gray-700">${item}</span>`;
                                }).join('')}
                            </div>
                        </div>` : ''}
                        ${detailFullItem('海关监管条件', d.customsSupervision)}
                        ${detailFullItem('检验检疫', d.inspectionQuarantine)}
                        <div class="grid grid-cols-2 gap-4 pt-2 text-sm text-gray-500 border-t border-gray-100 mt-4">
                            <div>创建时间: ${d.createdAt ? new Date(d.createdAt).toLocaleString('zh-CN') : '-'}</div>
                            <div>更新时间: ${d.updatedAt ? new Date(d.updatedAt).toLocaleString('zh-CN') : '-'}</div>
                        </div>
                    `;
                    document.getElementById('detailModal').classList.remove('hidden');
                }
            } catch (e) { showToast('获取详情失败', 'error'); }
        }
        function detailItem(label, value) { return `<div><span class="text-sm text-gray-500">${label}</span><p class="text-sm font-medium text-gray-900 mt-0.5">${value || '-'}</p></div>`; }
        function detailFullItem(label, value) { return value ? `<div class="pt-2"><span class="text-sm text-gray-500">${label}</span><p class="text-sm text-gray-900 mt-0.5 whitespace-pre-wrap">${value}</p></div>` : ''; }
        function closeDetailModal() { document.getElementById('detailModal').classList.add('hidden'); }

        function showToast(msg, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMessage').textContent = msg;
            icon.className = type === 'success' ? 'w-5 h-5 text-green-400' : 'w-5 h-5 text-red-400';
            toast.classList.remove('hidden');
            setTimeout(() => toast.classList.add('hidden'), 3000);
        }
    </script>
</body>
</html>
